<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таблицы Шульте</title>

<style>

  :root {
    --bg: #1a1a1a;
    --tile: #5a5a5a;
    --tile-text: #8e8e8e;   /* <-- цвет цифр/текста на плитках меняется здесь */
    --shadow-color: #303030;

    /* ---- иконка "глаз" (показывается по клавише U/Г, только во время игры) ---- */
    --eye-size: 120px;             /* <-- размер иконки глаза (меняется клавишами P/З и O/Щ) */
    --eye-color: var(--tile-text); /* <-- цвет иконки глаза */
    --eye-opacity: 1;              /* <-- прозрачность глаза (меняется клавишами L/Д и K/Л) */

    /* ---- слой РЕКОРДЫ (текст под плиткой размера, виден пока зажата R/К) ---- */
    --records-color: var(--tile-text);   /* <-- цвет текста рекорда */
    --records-font-size: 22px;           /* <-- размер шрифта строки рекорда */
    --records-gap: 12px;                 /* <-- отступ от плитки до строки рекорда */

    /* ---- кнопки уровней (вертикальный столбик, левый край главного экрана) ---- */
    --level-btn-size: 60px;      /* <-- сторона квадратной кнопки уровня */
    --level-btn-font-size: 22px; /* <-- размер цифры на кнопке уровня */
    --level-btn-gap: 16px;       /* <-- расстояние между кнопками уровней */
    --level-btn-infinity-size: 30px; /* <-- размер символа ∞ (крупнее обычной цифры, т.к. визуально мельче) */
    --level-btn-active-color: #e4e4e4; /* <-- цвет текста ВЫБРАННОГО сейчас уровня (ярче обычного) */

    /* ---- окно информации (клавиша B/И) ---- */
    --info-font-size: 40px;      /* <-- размер шрифта текста в окне информации */
    --info-glyphs-font-size: 15px; /* <-- размер шрифта у списка символов шрифта (40 строк) */

    /* ---- таймер обратного отсчёта (клавиша N/Т) ----
       Положение задаётся вручную, в пикселях, ОТ ЦЕНТРА экрана
       (не привязано ни к какому краю и не зависит от разрешения).
       --countdown-offset-x: сдвиг по горизонтали от центра
       (отрицательное — влево, положительное — вправо).
       --countdown-offset-y: сдвиг по вертикали от центра
       (отрицательное — вверх, положительное — вниз).
       Крути эти два числа руками под своё окно. */
    --countdown-offset-x: 770px;  /* <-- сдвиг от центра экрана по горизонтали, px */
    --countdown-offset-y: -320px;   /* <-- сдвиг от центра экрана по вертикали, px */
    --countdown-width: 340px;      /* <-- ширина плашки/окна ввода */
    --countdown-height: 120px;      /* <-- высота плашки/окна ввода */
    --countdown-font-size: 56px;   /* <-- размер шрифта времени/поля ввода */
    --countdown-expired-font-size: 44px; /* <-- размер шрифта у текста "ВРЕМЯ ВЫШЛО" (текст длиннее) */
    --countdown-expired-color: #ff3b3b; /* <-- цвет текста "ВРЕМЯ ВЫШЛО" (красный, как раньше было на уровне 3), теперь на ВСЕХ уровнях */

    /* ---- таймер для запоминания (уровни 13-16) ----
       Это ДВА таймера с ОБЩИМ расположением (одни и те же переменные):
       1) плашка-настройка в меню (клик — ввод нового значения);
       2) плашка обратного отсчёта прямо на уровне (не кликабельна).
       Положение — вручную, в пикселях, ОТ ЦЕНТРА экрана, так же,
       как у таймера N/Т выше. --memory-timer-offset-x — сдвиг по
       горизонтали от центра (отрицательное — влево, положительное —
       вправо), --memory-timer-offset-y — сдвиг по вертикали от центра
       (отрицательное — вверх, положительное — вниз). */
    --memory-timer-offset-x:700px;     /* <-- сдвиг от центра экрана по горизонтали, px */
    --memory-timer-offset-y: 260px;     /* <-- сдвиг от центра экрана по вертикали, px */
    --memory-timer-width: 260px;        /* <-- ширина плашки */
    --memory-timer-height: 110px;       /* <-- высота плашки */
    --memory-timer-label-font-size: 22px; /* <-- размер шрифта первой строки ("время на запоминание") */
    --memory-timer-value-font-size: 40px; /* <-- размер шрифта второй строки (00:10) / поля ввода */
    --memory-timer-bg-color: var(--tile);      /* <-- цвет фона плашки (отдельно от --tile, если нужно) */
    --memory-timer-text-color: var(--tile-text); /* <-- цвет текста плашки (отдельно от --tile-text, если нужно) */

    /* Плашка ОБРАТНОГО ОТСЧЁТА на самом уровне (13-16) теперь появляется
       РОВНО на том же месте, где плашка-настройка стоит в меню — позиция
       и размер берутся из ТЕХ ЖЕ переменных, что и у #memory-timer-widget
       (--memory-timer-offset-x / --memory-timer-offset-y / --memory-timer-width /
       --memory-timer-height, см. выше). Отдельных координат/размера у неё
       больше нет — если нужно подвинуть таймер на уровне, двигай
       --memory-timer-offset-x/--memory-timer-offset-y — это одинаково подвинет
       и плашку в меню, и таймер на уровне.
       Шрифты подписи/значения и цвета можно настраивать независимо: */
    --memory-level-timer-label-font-size: 22px;
    --memory-level-timer-value-font-size: 40px;
    --memory-level-timer-bg-color: var(--tile);
    --memory-level-timer-text-color: var(--tile-text);

    /* ---- подсказка по средней кнопке мыши ---- */
    --peek-color: #e5484d;       /* <-- цвет подсказки (сейчас красный), меняется тут */

    /* ---- подсветка клетки при верном/неверном ответе (уровни с colorFeedback) ----
       Цвет и прозрачность — раздельные переменные (CSS ниже собирает их через
       color-mix). Длительность мигания в мс — JS-константы FLASH_CORRECT_DURATION_MS
       и FLASH_WRONG_DURATION_MS в начале <script> (ищи "Настройки мигания клеток"). */
    --flash-correct-color: #b3ffb3;   /* <-- цвет плашки при верном ответе */
    --flash-correct-opacity: 50%;     /* <-- прозрачность плашки при верном ответе */
    --flash-wrong-color: #ffcccc;     /* <-- цвет плашки при неверном ответе */
    --flash-wrong-opacity: 50%;       /* <-- прозрачность плашки при неверном ответе */
  }


  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: #ddd;
    font-family: 'PT Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
  }

  /* ---------- LEVEL SELECT ----------
     Вертикальный столбик кнопок уровней (по умолчанию 10, "1".."10").
     Теперь это не отдельный экран, а левая колонка внутри #menu-screen —
     кнопки уровней видны вместе с плитками размеров на любом уровне.
     Положение — только через CSS ниже (gap/padding у #menu-screen).
     Кнопки НЕ двигаются мышью — только правкой настроек тут
     и данных в массиве LEVELS. */

  /* Обёртка над столбиком уровней: сама она вынесена из потока и
     вертикально центрирована (как раньше был .level-grid), а внутри —
     .level-grid (кнопки уровней) и .theme-row (3 кнопки темы) друг под другом. */
  .level-panel {
    position: absolute;         /* <-- вынесен из потока, чтобы не сдвигать центр .menu-grid */
    left: 50%;                  /* <-- база: центр экрана, не трогать */
    top: 50%;
    --level-panel-offset-x: -750px; /* <-- расстояние от ЦЕНТРА экрана в px (отрицательное = влево). Крути это число вручную под своё разрешение. */
    transform: translate(calc(-50% + var(--level-panel-offset-x)), -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;                  /* <-- расстояние между блоком уровней и кнопками темы */
  }

  .level-grid {
    display: grid;
    grid-template-columns: max-content max-content; /* <-- 2 кнопки в ряд (1-2, 3-4 ... 11-12), ширина колонки — по содержимому */
    justify-items: center;      /* <-- кнопки строго по центру своей колонки */
    gap: var(--level-btn-gap);
  }

  /* ---------- КНОПКИ ТЕМЫ (серая / чёрная / белая) ----------
     3 кнопки в ряд под столбиком уровней. Каждая кнопка — маленький
     квадрат-превью цвета фона темы + подпись снизу. Активная тема
     подсвечена рамкой (--level-btn-active-color). */
  .theme-row {
    display: flex;
    flex-direction: row;
    gap: 40px;
  }

  .theme-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'PT Sans', sans-serif;
    padding: 0;
  }

  .theme-swatch {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 2px solid transparent;
    box-shadow: 0 3px 0 var(--shadow-color);
  }

  .theme-btn.active .theme-swatch {
    border-color: var(--level-btn-active-color);
  }

  .theme-btn-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--tile-text);
    white-space: nowrap;
  }

  .theme-btn.active .theme-btn-label {
    color: var(--level-btn-active-color);
  }

  .level-tile {
    background: var(--tile);
    border: none;
    border-radius: 12px;
    color: var(--tile-text);
    font-family: 'PT Sans', sans-serif;
    font-size: var(--level-btn-font-size);
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--shadow-color);
    min-width: var(--level-btn-size);  /* <-- минимальная ширина как раньше (квадрат) */
    height: var(--level-btn-size);
    padding: 0 14px;                    /* <-- при длинном названии кнопка расширяется под текст */
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Символ бесконечности (чётные уровни) — отдельный размер шрифта,
     т.к. визуально мельче цифр/текста при том же font-size. */
  .level-tile.level-infinity {
    font-size: var(--level-btn-infinity-size);
  }

  .level-tile:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--shadow-color);
  }

  /* Кнопка выбранного сейчас уровня — текст чуть ярче остальных.
     Цвет вынесен в отдельную переменную, чтобы менять его отдельно
     от обычного цвета текста кнопок уровней (--tile-text). */
  .level-tile.active {
    color: var(--level-btn-active-color);
  }

  /* ---------- MENU (выбор размера таблицы) ---------- */

  #menu-screen {
    display: none;
    flex-direction: row;
    align-items: center;
    justify-content: center;   /* <-- .menu-grid (плитки размеров) строго по центру экрана */
    width: 100%;
    height: 100%;
    padding: 20vh 24px;
    position: relative;         /* <-- точка отсчёта для абсолютного .level-grid */
  }

  /* Размер сетки меню: ширина блока с кнопками задаётся здесь (width / max-width).
     Чтобы изменить расстояние между плитками — меняйте значение gap ниже (статичное, в px).
     grid-auto-flow: column + порядок плиток 2..10 в разметке даёт раскладку:
     2 5 8
     3 6 9
     4 7 10 */
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    grid-auto-flow: column;
    gap: 100px;                 /* <-- расстояние между плитками меню (одинаковое по X и Y) */
    width: 70%;                /* <-- общая ширина блока меню */
    max-width: 1080px;          /* <-- ограничение максимальной ширины блока меню */
  }

  /* Размер/форма каждой плитки меню: aspect-ratio задаёт соотношение сторон,
     font-size — размер текста "NxN" — увеличивай/уменьшай это значение. */
  .menu-tile {
    background: var(--tile);
    border: none;
    border-radius: 14px;
    color: var(--tile-text);
    font-family: 'PT Sans', sans-serif;
    font-size: 48px;           /* <-- РАЗМЕР ТЕКСТА НА ПЛИТКАХ ГЛАВНОГО МЕНЮ (меняй тут) */
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--shadow-color);
    aspect-ratio: 2 / 1;       /* <-- соотношение сторон плитки (ширина / высота) */
    width: 100%;
  }

  .menu-tile:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--shadow-color);
  }

  /* Обёртка вокруг плитки размера — стоит в сетке .menu-grid.
     Внутри неё же — строка рекорда (.tile-record), обычно скрытая
     (visibility: hidden — место зарезервировано, чтобы плитки не
     прыгали), видимая только пока зажата клавиша R/К. */
  .menu-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .tile-record {
    margin-top: var(--records-gap);   /* <-- отступ от плитки до строки рекорда */
    font-family: 'PT Sans', sans-serif;
    font-weight: 700;
    font-size: var(--records-font-size); /* <-- размер шрифта рекорда */
    color: var(--records-color);         /* <-- цвет текста рекорда */
    font-variant-numeric: tabular-nums;
    visibility: hidden;                  /* <-- по умолчанию скрыт, но место занимает */
  }

  .tile-record.show {
    visibility: visible;
  }

  /* ---------- МОБИЛЬНАЯ ВЕРСИЯ ----------
     Класс "is-mobile" вешается на <body> из JS (см. isMobileDevice() в <script>) —
     ТОЛЬКО на реальных телефонах/планшетах (по navigator.userAgent и грубому
     указателю pointer:coarse), а не при простом сужении окна на компьютере.
     Свайпы вниз/вверх во время игры (обновить таблицу / выйти в меню) тоже
     работают только при наличии этого класса — см. touchstart/touchend в
     <script>. На компьютере ничего из этого блока не применяется и не мешает.

     Задача блока: 1) уменьшить кнопки уровней (.level-tile) примерно в 2 раза
     и 2) уместить их вместе с плитками размеров (.menu-grid) на экране телефона
     без пересечения — для этого столбик уровней превращается в горизонтальную
     полосу НАД плитками размеров (вместо абсолютной колонки слева, как на
     компьютере). */
  body.is-mobile #menu-screen {
    flex-direction: column;
    justify-content: center;
    gap: 4vh;
    padding: 4vh 12px;
  }

  body.is-mobile .level-panel {
    position: static;                 /* <-- вместо absolute-колонки слева */
    top: auto;
    left: auto;
    transform: none;
    gap: 10px;
  }

  body.is-mobile .level-grid {
    grid-template-columns: repeat(6, max-content); /* <-- 6 кнопок в ряд, 2 ряда (1..12) */
    gap: 8px;                          /* <-- было --level-btn-gap: 16px, тут вдвое меньше */
    justify-content: center;
  }

  body.is-mobile .theme-swatch {
    width: 22px;
    height: 22px;
  }

  body.is-mobile .theme-btn-label {
    font-size: 9px;
  }

  body.is-mobile .level-tile {
    min-width: 30px;                   /* <-- было --level-btn-size: 60px, тут вдвое меньше */
    height: 30px;
    padding: 0 6px;
    font-size: 13px;                   /* <-- уменьшено, чтобы уместиться в кнопку 30px */
    border-radius: 8px;
  }

  body.is-mobile .level-tile.level-infinity {
    font-size: 16px;
  }

  body.is-mobile .menu-grid {
    gap: 16px;                         /* <-- было 100px на компьютере */
    width: 100%;
    max-width: 340px;
  }

  body.is-mobile .menu-tile {
    font-size: 26px;                   /* <-- было 48px на компьютере, текст ещё влезает */
  }

  body.is-mobile .tile-record {
    font-size: 16px;
    margin-top: 6px;
  }

  /* ---------- GAME ---------- */

  #game-screen {
    display: none;
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* Сетка позиционируется абсолютно и центрируется относительно центра экрана,
     поэтому при изменении масштаба (+/-) она растёт/уменьшается именно из центра. */
  #grid-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  #grid {
    display: grid;
    width: 100%;
    height: 100%;
  }

  .cell {
    background: var(--tile);
    color: var(--tile-text);
    font-family: 'PT Sans', sans-serif;
    border: none;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 6px 0 var(--shadow-color);
    position: relative; /* нужно, чтобы z-index ниже работал предсказуемо */
  }

  .cell.static-empty {
    cursor: default;
  }

  /* Амплитуда тряски при неверном клике — меняйте px-значения ниже. */
  @keyframes shake-x {
    0%   { transform: translateX(0); }
    20%  { transform: translateX(-3px); }
    40%  { transform: translateX(3px); }
    60%  { transform: translateX(-2px); }
    80%  { transform: translateX(2px); }
    100% { transform: translateX(0); }
  }

  .cell.shake {
    animation: shake-x 0.3s ease;
  }

  /* Подсветка клетки для уровней с colorFeedback (сейчас — 3 и 4):
     верный ответ — зелёным на 0.3с, неверный — красным на 0.3с,
     без тряски вбок (класс .shake для таких уровней не используется). */
  .cell.flash-correct {
    background: color-mix(in srgb, var(--flash-correct-color) var(--flash-correct-opacity), transparent);
  }

  .cell.flash-wrong {
    background: color-mix(in srgb, var(--flash-wrong-color) var(--flash-wrong-opacity), transparent);
  }

  /* ---------- PEEK (средняя кнопка мыши — показать искомую цифру) ---------- */

  #peek-overlay {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--peek-color);  /* <-- цвет подсказки по средней кнопке мыши */
    font-family: 'PT Sans', sans-serif;
    font-weight: 700;
    pointer-events: none;
    z-index: 1000;
  }

  #peek-overlay.show { display: block; }

  /* ---------- EYE (клавиша U/Г) ----------
     Иконка глаза — картинка, перекрашиваемая через mask-image:
     цвет задаёт --eye-color, прозрачность — --eye-opacity,
     размер — --eye-size (объявлены в :root выше). */

  #eye-overlay {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: var(--eye-size);

  /* ---------- FINISH PLATE ---------- */

  /* Чтобы увеличить плашку с результатом — меняй padding ниже.
     Чтобы увеличить шрифт времени — меняй font-size в #finish-time. */
  #finish-overlay {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--tile);
    border-radius: 14px;
    box-shadow: 0 6px 0 var(--shadow-color);
    padding: 26px 44px;        /* <-- РАЗМЕР ОКНА С ТАЙМЕРОМ (увеличить — увеличить padding) */
    text-align: center;
  }

  #finish-overlay.show {
    display: block;
  }

  #finish-time {
    font-family: 'PT Sans', sans-serif;
    font-size: 51px;           /* <-- РАЗМЕР ШРИФТА ИТОГОВОГО ТАЙМЕРА */
    font-weight: 700;
    color: var(--tile-text);
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  #finish-errors {
    margin-top: 10px;
    font-family: 'PT Sans', sans-serif;
    font-size: 24px;           /* <-- размер строки "Ошибок: N" (увеличено на 20%) */
    font-weight: 700;
    color: var(--tile-text);
    opacity: 0.85;
  }

  /* ---------- ОКНО ИНФОРМАЦИИ (клавиша B/И, во весь экран, 600×800) ----------
     Пока зажата B/И — перекрывает собой весь остальной интерфейс.
     Отпустили клавишу — окно прячется, всё, что было под ним,
     видно как прежде (оно никуда не девалось, просто было закрыто). */

  #info-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);      /* <-- перекрывает интерфейс полностью */
    align-items: center;
    justify-content: center;
    z-index: 5000;
  }

  #info-overlay.show { display: flex; }

  #info-box {
    width: 600px;                /* <-- ширина окна информации */
    height: 800px;                /* <-- высота окна информации */
    max-width: 96vw;
    max-height: 96vh;
    background: var(--tile);
    border-radius: 14px;
    box-shadow: 0 6px 0 var(--shadow-color);
    padding: 32px;
    box-sizing: border-box;
    overflow: auto;               /* <-- если содержимое не влезает — появится скролл */
    color: var(--tile-text);
    font-family: 'PT Sans', sans-serif;
    font-weight: 700;
    font-size: var(--info-font-size); /* <-- размер шрифта КОРОТКОГО текста (например "123") */
  }

  /* Стиль для списка символов шрифта (см. #info-box в <body>) — свой,
     более мелкий размер шрифта, чтобы 40 строк помещались в окно. */
  #info-box .info-glyphs {
    font-size: var(--info-glyphs-font-size); /* <-- размер шрифта строк со символами */
    font-weight: 400;
    line-height: 1.5;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---------- ТАЙМЕР ОБРАТНОГО ОТСЧЁТА (клавиша N/Т) ----------
     Два отдельных блока с одинаковыми позицией/размером (см. переменные
     --countdown-* выше): #countdown-input-overlay — окно ввода времени
     (видно, пока открыто), #countdown-display — плашка "ВРЕМЯ ВЫШЛО"
     (видна только 5 секунд после истечения отсчёта, остальное время
     скрыта — самого тикающего таймера на экране не видно). Цвета —
     те же, что у плиток размеров (--tile / --tile-text), как и просили. */
  #countdown-input-overlay,
  #countdown-display {
    left: 50%;
    top: 50%;
    transform: translate(calc(-50% + var(--countdown-offset-x)), calc(-50% + var(--countdown-offset-y)));
    display: none;
    position: fixed;
    width: var(--countdown-width);
    height: var(--countdown-height);
    background: var(--tile);
    color: var(--tile-text);
    border-radius: 12px;
    box-shadow: 0 4px 0 var(--shadow-color);
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'PT Sans', sans-serif;
    font-weight: 700;
    font-size: var(--countdown-font-size);
  }

  #countdown-input-overlay.show,
  #countdown-display.show {
    display: flex;
  }

  /* Текст "ВРЕМЯ ВЫШЛО" длиннее, чем время в поле ввода — свой,
     уменьшенный размер шрифта, чтобы помещался в ту же плашку.
     Цвет — красный на ВСЕХ уровнях (--countdown-expired-color;
     раньше такой красный был только на уровне 3, теперь везде). */
  #countdown-display.expired {
    font-size: var(--countdown-expired-font-size);
    line-height: 1.2;
    color: var(--countdown-expired-color);
  }

  #countdown-input-overlay { z-index: 2100; } /* поверх плашки отсчёта, пока вводим новое время */
  #countdown-display { z-index: 2000; }

  #countdown-input {
    width: 90%;
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    color: var(--tile-text);
    font-family: 'PT Sans', sans-serif;
    font-weight: 700;
    font-size: var(--countdown-font-size);
  }

  /* ---------- ТАЙМЕР ДЛЯ ЗАПОМИНАНИЯ (уровни 13-16) ----------
     В отличие от таймера обратного отсчёта — это НЕ обратный отсчёт на
     экране, а постоянно видимая (пока условия ниже выполнены) плашка-
     настройка: 1-я строка "время на запоминание", 2-я строка — текущее
     сохранённое значение в формате мм:сс (по умолчанию 00:10). Клик по
     плашке превращает 2-ю строку в поле ввода — вводишь целое число
     секунд, Enter — сохраняется в localStorage и подставляется
     автоматически при следующем входе на уровень/странице.
     Показывается: ВСЕГДА в меню размеров уровней 13-16, и (если не
     отключено JS-константой SHOW_MEMORY_TIMER_DURING_LEVEL, см.
     <script>) — прямо во время игры на этих уровнях. */
  #memory-timer-widget {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(calc(-50% + var(--memory-timer-offset-x)), calc(-50% + var(--memory-timer-offset-y)));
    width: var(--memory-timer-width);
    height: var(--memory-timer-height);
    background: var(--memory-timer-bg-color);
    color: var(--memory-timer-text-color);
    border-radius: 12px;
    box-shadow: 0 4px 0 var(--shadow-color);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'PT Sans', sans-serif;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    z-index: 1500;
  }

  #memory-timer-widget.show { display: flex; }

  #memory-timer-label {
    font-size: var(--memory-timer-label-font-size);
    opacity: 0.85;
    margin-bottom: 4px;
  }

  #memory-timer-value {
    font-size: var(--memory-timer-value-font-size);
    font-variant-numeric: tabular-nums;
  }

  #memory-timer-input {
    display: none;
    width: 90%;
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    color: var(--memory-timer-text-color);
    font-family: 'PT Sans', sans-serif;
    font-weight: 700;
    font-size: var(--memory-timer-value-font-size);
  }

  /* Плашка обратного отсчёта на самом уровне (13-16) — слева снизу.
     В отличие от #memory-timer-widget (настройка справа), эта плашка —
     НЕ кликабельна, просто тикает от заданного времени до 00:00, и
     видна ТОЛЬКО во время фазы запоминания на уровне (не в меню). */
  #memory-level-timer-widget {
    display: none;
    position: fixed;
    /* Позиция и размер — ТЕ ЖЕ переменные, что у плашки-настройки в меню
       (#memory-timer-widget), чтобы таймер на уровне появлялся ровно там
       же, где стоит плашка в меню размеров. */
    left: 50%;
    top: 50%;
    transform: translate(calc(-50% + var(--memory-timer-offset-x)), calc(-50% + var(--memory-timer-offset-y)));
    width: var(--memory-timer-width);
    height: var(--memory-timer-height);
    background: var(--memory-level-timer-bg-color);
    color: var(--memory-level-timer-text-color);
    border-radius: 12px;
    box-shadow: 0 4px 0 var(--shadow-color);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'PT Sans', sans-serif;
    font-weight: 700;
    user-select: none;
    z-index: 1500;
  }

  #memory-level-timer-widget.show { display: flex; }

  #memory-level-timer-label {
    font-size: var(--memory-level-timer-label-font-size);
    opacity: 0.85;
    margin-bottom: 4px;
  }

  #memory-level-timer-value {
    font-size: var(--memory-level-timer-value-font-size);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div id="app">

  <div id="menu-screen">
    <div class="level-panel" id="level-panel">
      <div class="level-grid" id="level-grid"></div>
      <div class="theme-row" id="theme-row"></div>
    </div>
    <div class="menu-grid" id="menu-grid"></div>
  </div>

  <div id="game-screen">
    <div id="grid-wrap">
      <div id="grid"></div>
    </div>
    <div id="finish-overlay">
      <div id="finish-time"></div>
      <div id="finish-errors"></div>
    </div>
  </div>

  <div id="peek-overlay"></div>

  <div id="eye-overlay"></div>

  <div id="info-overlay">
    <div id="info-box">
      тут будет инфа если я доберусь до этого
    </div>
  </div>

  <div id="countdown-input-overlay">
    <input id="countdown-input" type="text" inputmode="decimal" autocomplete="off" placeholder="5 или 5.20" />
  </div>

  <div id="countdown-display"></div>

  <div id="memory-timer-widget">
    <div id="memory-timer-label">время на запоминание</div>
    <div id="memory-timer-value">00:10</div>
    <input id="memory-timer-input" type="text" inputmode="numeric" autocomplete="off" />
  </div>

  <div id="memory-level-timer-widget">
    <div id="memory-level-timer-label">время на запоминание</div>
    <div id="memory-level-timer-value">00:10</div>
  </div>

</div>

<script>
  /* =========================================================
     УРОВНИ
     По умолчанию 12 уровней (id level1..level12), у каждого —
     полный набор размеров 2x2..10x10, как в обычном меню.
     Рекорды и масштаб хранятся отдельно по id, так что уровни
     не мешают друг другу. Чтобы поменять название кнопки или
     то, что показывается на плитке вместо числа — правьте
     name / label(order, total) прямо здесь.

     У каждого уровня пять флагов-модификаторов поведения игры:
     - instantRestart: true — после прохождения таблицы плашка
       с временем/ошибками НЕ показывается, сразу стартует новая
       таблица того же размера. Рекорд при этом всё равно
       сохраняется и виден в меню по удержанию R/К, как обычно.
     - colorFeedback: true — при верном ответе клетка на
       FLASH_CORRECT_DURATION_MS красится в --flash-correct-color
       (с прозрачностью --flash-correct-opacity), при неверном —
       на FLASH_WRONG_DURATION_MS в --flash-wrong-color (с
       --flash-wrong-opacity) БЕЗ тряски вбок; число на клетке при
       верном ответе не исчезает, клетка остаётся кликабельной —
       повторный клик по уже отвеченной клетке тоже мигает красным.
       Цвета/прозрачность — в :root, длительности — JS-константы
       FLASH_CORRECT_DURATION_MS / FLASH_WRONG_DURATION_MS (ищи
       "Настройки мигания клеток" в <script>).
     - revealLetter: true — при верном ответе число заменяется
       случайными заглавными русскими буквами (ALPHABET_RU в
       <script>) — ровно столько букв, сколько было цифр в числе
       (1 цифра → 1 буква, 2 цифры → 2 буквы), тем же шрифтом.
     - clickAnywhere: true — клик по конкретной клетке не нужен,
       засчитывается клик в ЛЮБОЕ место игрового экрана (см.
       глобальный обработчик click рядом с buildGrid — он нарочно
       игнорирует клик по плитке в меню, которым уровень запускается,
       чтобы не засчитывать её как игровой клик).
     - hideErrorsLabel: true — на финальной плашке (см.
       ФИНАЛЬНАЯ ПЛАШКА выше) не показывается строка "ОШИБОК: N"
       вообще (сама плашка с временем всё равно показывается,
       если только вдобавок не включён instantRestart).
     Включены: 2 — instantRestart; 3 — colorFeedback; 4 — оба;
     5/6 — трёхзначные числа на всех размерах (переопределён label),
     6 вдобавок с instantRestart; 7/8 — revealLetter, 8 вдобавок
     с instantRestart; 9 — clickAnywhere + hideErrorsLabel; 10 —
     clickAnywhere + instantRestart; 11 — clickAnywhere +
     colorFeedback + hideErrorsLabel (клик где угодно на экране +
     зелёная подсветка верной клетки теми же параметрами
     цвета/прозрачности/длительности, что и у 3/4); 12 — то же,
     что 11, плюс instantRestart. Правьте/добавляйте по этому же
     принципу.

     НАЗВАНИЯ КНОПОК: у "нечётных" уровней с особым режимом (1, 3,
     5, 7, 9, 11) — словесные названия ("Обычный уровень", "Зелёный/
     красный", "1 за другим" и т.д., правятся ниже через
     LEVELS[i].name). У "чётных" уровней (2/4/6/8/10/12) — они
     являются "бесконечной" версией соседнего нечётного (тот же
     режим + instantRestart), поэтому вместо числа — символ ∞ (см.
     ниже, --level-btn-infinity-size в :root регулирует его размер
     отдельно от остальных кнопок).
     ========================================================= */
  const LEVELS = [];
  for (let i = 1; i <= 12; i++) {
    LEVELS.push({
      id: 'level' + i,
      name: String(i),
      label: (order, total) => String(order).padStart(total <= 9 ? 1 : 2, '0'),
      instantRestart: false,
      colorFeedback: false,
      revealLetter: false,
      clickAnywhere: false,
      hideErrorsLabel: false,
      memoryLevel: false,
      revealDigit: false,
      memoryInstantRestart: false
    });
  }

  // ---- УРОВНИ 13-16 (запоминание расположения цифр) ----
  // memoryLevel: true — при входе на размер сначала показываются ВСЕ цифры на
  //   своих местах (клики по клеткам ничего не делают, таймер рекорда не идёт),
  //   через N секунд (значение — плашка "время на запоминание", см. ниже и
  //   <script>-раздел "ТАЙМЕР ДЛЯ ЗАПОМИНАНИЯ") цифры прячутся и стартует
  //   обычный поиск по возрастанию — таймер рекорда включается именно в
  //   этот момент, а не при входе на уровень.
  // revealDigit: true — при верном клике клетка не пустеет и не превращается
  //   в букву, а показывает СВОЮ исходную цифру (и остаётся видимой до конца
  //   уровня) — сочетается с colorFeedback (уровни 15/16, доп. зелёная/красная
  //   вспышка как на уровне 3) либо без него (уровни 13/14 — просто открывается
  //   цифра, без вспышки, и клетка становится некликабельной, как revealLetter).
  // memoryInstantRestart: true — после нахождения всех цифр (уровни 14/16)
  //   плашка с итогом НЕ показывается: сразу же таблица перестраивается заново
  //   (новое случайное расположение), снова показываются все цифры на N секунд,
  //   потом прячутся и запускается новый поиск — рекорд всё равно сохраняется
  //   в фоне. Это НЕ то же самое, что обычный instantRestart (тот перестраивает
  //   таблицу мгновенно, без фазы запоминания) — поэтому флаг отдельный.
  for (let i = 13; i <= 16; i++) {
    LEVELS.push({
      id: 'level' + i,
      name: String(i),
      label: (order, total) => String(order).padStart(total <= 9 ? 1 : 2, '0'),
      instantRestart: false,
      colorFeedback: false,
      revealLetter: false,
      clickAnywhere: false,
      hideErrorsLabel: false,
      memoryLevel: true,
      revealDigit: true,
      memoryInstantRestart: false
    });
  }
  LEVELS[12].name = 'Исчезающие цифры';   // уровень 13
  LEVELS[13].name = '∞';                  // уровень 14 (бесконечная версия 13)
  LEVELS[13].memoryInstantRestart = true; // уровень 14
  // Названию уровня 15 не было явно задано в ТЗ — назвал по аналогии с
  // уровнем 3 ("Зелёный/красный"), т.к. отличие 15/16 от 13/14 — именно
  // зелёная/красная подсветка при клике. Легко переименовать здесь же.
  LEVELS[14].name = 'Исчезающие цифры (цвет)'; // уровень 15
  LEVELS[14].colorFeedback = true;             // уровень 15
  LEVELS[14].revealDigit = false;              // уровень 15: после верного клика цифра НЕ показывается, только вспышка
  LEVELS[15].name = '∞';                       // уровень 16 (бесконечная версия 15)
  LEVELS[15].colorFeedback = true;             // уровень 16
  LEVELS[15].memoryInstantRestart = true;      // уровень 16
  LEVELS[15].revealDigit = false;              // уровень 16: после верного клика цифра НЕ показывается, только вспышка
  LEVELS[1].instantRestart = true;                       // уровень 2
  LEVELS[2].colorFeedback = true;                         // уровень 3
  LEVELS[3].instantRestart = true;                        // уровень 4
  LEVELS[3].colorFeedback = true;                         // уровень 4
  LEVELS[4].label = (order) => String(order).padStart(3, '0'); // уровень 5 — трёхзначные числа
  LEVELS[5].label = (order) => String(order).padStart(3, '0'); // уровень 6 — трёхзначные числа
  LEVELS[5].instantRestart = true;                        // уровень 6
  LEVELS[6].revealLetter = true;                          // уровень 7 — верный ответ превращается в букву
  LEVELS[7].revealLetter = true;                          // уровень 8 — то же + мгновенный рестарт
  LEVELS[7].instantRestart = true;                        // уровень 8
  LEVELS[8].clickAnywhere = true;                         // уровень 9 — клик где угодно на экране
  LEVELS[8].hideErrorsLabel = true;                        // уровень 9 — на плашке результата не показывать "ОШИБОК: N"
  LEVELS[9].clickAnywhere = true;                         // уровень 10 — то же + мгновенный рестарт
  LEVELS[9].instantRestart = true;                        // уровень 10
  LEVELS[10].clickAnywhere = true;                        // уровень 11 — клик где угодно + зелёная подсветка
  LEVELS[10].colorFeedback = true;                        // уровень 11
  LEVELS[10].hideErrorsLabel = true;                       // уровень 11 — на плашке результата не показывать "ОШИБОК: N"
  LEVELS[11].clickAnywhere = true;                        // уровень 12 — то же + мгновенный рестарт
  LEVELS[11].colorFeedback = true;                        // уровень 12
  LEVELS[11].instantRestart = true;                       // уровень 12

  // Названия кнопок. "Чётные" уровни (2/4/6/8/10/12) — это "бесконечные"
  // версии соседнего нечётного уровня (тот же режим + instantRestart),
  // поэтому вместо числа на них символ бесконечности.
  LEVELS[0].name = 'Обычный уровень';   // уровень 1
  LEVELS[2].name = 'Зелёный/красный';   // уровень 3
  LEVELS[4].name = 'Трёхзначный';       // уровень 5
  LEVELS[6].name = 'С буквами';         // уровень 7
  LEVELS[8].name = '1 за другим';       // уровень 9
  LEVELS[10].name = '1 за другим цветной'; // уровень 11
  LEVELS[1].name = '∞';                // уровень 2  (бесконечный №1)
  LEVELS[3].name = '∞';                // уровень 4  (бесконечный №3)
  LEVELS[5].name = '∞';                // уровень 6  (бесконечный №5)
  LEVELS[7].name = '∞';                // уровень 8  (бесконечный №7)
  LEVELS[9].name = '∞';                // уровень 10 (бесконечный №9)
  LEVELS[11].name = '∞';               // уровень 12 (бесконечный №11)

  const levelGrid = document.getElementById('level-grid');
  const menuGrid = document.getElementById('menu-grid');
  const menuScreen = document.getElementById('menu-screen');
  const gameScreen = document.getElementById('game-screen');
  const grid = document.getElementById('grid');
  const gridWrap = document.getElementById('grid-wrap');
  const finishOverlay = document.getElementById('finish-overlay');
  const finishTime = document.getElementById('finish-time');
  const finishErrors = document.getElementById('finish-errors');
  const peekOverlay = document.getElementById('peek-overlay');
  const eyeOverlay = document.getElementById('eye-overlay');
  const infoOverlay = document.getElementById('info-overlay');

  const sizes = [2,3,4,5,6,7,8,9,10];
  const oddWithGap = new Set([5,7,9]);
  const topPad15 = new Set([2,3,4,5]);
  const topPad10 = new Set([6,7]);

  // Расстояние между плитками внутри таблицы:
  // COL_GAP — зазор по бокам (между соседями в строке).
  // ROW_GAP — зазор по вертикали = высота тени + COL_GAP.
  const COL_GAP = 2;
  const SHADOW_OFFSET = 6;
  const ROW_GAP = SHADOW_OFFSET + COL_GAP;

  // Последний выбранный уровень запоминается в localStorage (ключ
  // schulte-current-level), чтобы после перезагрузки страницы открывался
  // тот же уровень, на котором пользователь был в прошлый раз.
  function loadSavedLevel() {
    let savedId = null;
    try { savedId = localStorage.getItem('schulte-current-level'); } catch (e) {}
    const found = LEVELS.find(l => l.id === savedId);
    return found || LEVELS[0];
  }

  const initialLevel = loadSavedLevel();
  let currentLevelId = initialLevel.id;
  let currentLevel = initialLevel;

  // ---------- уровни ----------
  const levelButtonEls = {};
  LEVELS.forEach(level => {
    const btn = document.createElement('button');
    btn.className = 'level-tile';
    if (level.name === '∞') btn.classList.add('level-infinity');
    btn.textContent = level.name;
    btn.addEventListener('click', () => {
      currentLevelId = level.id;
      currentLevel = level;
      try { localStorage.setItem('schulte-current-level', currentLevelId); } catch (e) {}
      updateActiveLevelButton();
      showMenu();
    });
    levelGrid.appendChild(btn);
    levelButtonEls[level.id] = btn;
  });

  // Подсвечивает кнопку текущего уровня цветом --level-btn-active-color
  // (см. класс .level-tile.active в CSS), остальные — обычным цветом.
  function updateActiveLevelButton() {
    LEVELS.forEach(level => {
      levelButtonEls[level.id].classList.toggle('active', level.id === currentLevelId);
    });
  }
  updateActiveLevelButton();

  // ---------- ТЕМЫ (серая / чёрная / белая) ----------
  // "Серая" — исходные цвета, которые были в :root до появления тем.
  // "Чёрная" и "Белая" — по запрошенным скриншотам. Каждая тема — набор
  // CSS-переменных, применяется через document.documentElement.style,
  // выбор запоминается в localStorage (ключ schulte-theme).
  const THEMES = {
    grey: {
      label: 'Серая тема',
      vars: {
        '--bg': '#1a1a1a',
        '--tile': '#5a5a5a',
        '--tile-text': '#8e8e8e',
        '--shadow-color': '#303030',
      },
    },
    black: {
      label: 'Чёрная тема',
      vars: {
        '--bg': '#141414',
        '--tile': '#262626',
        '--tile-text': '#c9c9c9',
        '--shadow-color': '#0a0a0a',
      },
    },
    white: {
      label: 'Белая тема',
      vars: {
        '--bg': '#f2f2f2',
        '--tile': '#ffffff',
        '--tile-text': '#1a1a1a',
        '--shadow-color': '#d8d8d8',
      },
    },
  };

  function loadSavedTheme() {
    let saved = null;
    try { saved = localStorage.getItem('schulte-theme'); } catch (e) {}
    return THEMES[saved] ? saved : 'grey';
  }

  let currentTheme = loadSavedTheme();

  function applyTheme(name) {
    const theme = THEMES[name];
    if (!theme) return;
    currentTheme = name;
    Object.entries(theme.vars).forEach(([key, value]) => {
      document.documentElement.style.setProperty(key, value);
    });
    try { localStorage.setItem('schulte-theme', name); } catch (e) {}
    updateActiveThemeButton();
  }

  const themeRow = document.getElementById('theme-row');
  const themeButtonEls = {};
  Object.keys(THEMES).forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'theme-btn';

    const swatch = document.createElement('div');
    swatch.className = 'theme-swatch';
    swatch.style.background = THEMES[name].vars['--bg'];

    const label = document.createElement('div');
    label.className = 'theme-btn-label';
    label.textContent = THEMES[name].label;

    btn.appendChild(swatch);
    btn.appendChild(label);
    btn.addEventListener('click', () => applyTheme(name));

    themeRow.appendChild(btn);
    themeButtonEls[name] = btn;
  });

  function updateActiveThemeButton() {
    Object.keys(THEMES).forEach(name => {
      themeButtonEls[name].classList.toggle('active', name === currentTheme);
    });
  }

  applyTheme(currentTheme);

  // ---------- плитки размеров таблицы + строка рекорда под каждой ----------
  // Строка рекорда (.tile-record) обычно скрыта (visibility: hidden) и
  // становится видимой только пока зажата клавиша R/К — см. updateRecordsVisibility().
  const tileRecordEls = {};
  sizes.forEach(n => {
    const wrap = document.createElement('div');
    wrap.className = 'menu-cell';

    const btn = document.createElement('button');
    btn.className = 'menu-tile';
    btn.textContent = `${n}x${n}`;
    btn.addEventListener('click', () => startGame(n));

    const rec = document.createElement('div');
    rec.className = 'tile-record';
    rec.textContent = '00:00:00';

    wrap.appendChild(btn);
    wrap.appendChild(rec);
    menuGrid.appendChild(wrap);

    tileRecordEls[n] = rec;
  });

  let currentSize = 0;
  let currentTarget = 1;
  let total = 0;
  let startTime = 0;
  let finished = false;
  let inGame = false;
  let baseSize = 0;
  let scale = 1;
  let mistakes = 0;
  let currentFontSize = 24;

  const scaleMemory = {};
  const bestMemory = {};

  function scaleKey(n) { return 'schulte-scale-' + currentLevelId + '-' + n; }
  function bestKey(n) { return 'schulte-best-' + currentLevelId + '-' + n; }

  function loadScale(n) {
    try {
      const v = localStorage.getItem(scaleKey(n));
      return v ? parseFloat(v) : 1;
    } catch (e) {
      return scaleMemory[scaleKey(n)] || 1;
    }
  }

  function saveScale(n, val) {
    try {
      localStorage.setItem(scaleKey(n), val);
    } catch (e) {
      scaleMemory[scaleKey(n)] = val;
    }
  }

  function loadBest(n) {
    try {
      const v = localStorage.getItem(bestKey(n));
      return v ? parseFloat(v) : null;
    } catch (e) {
      return bestMemory[bestKey(n)] != null ? bestMemory[bestKey(n)] : null;
    }
  }

  function saveBestIfBetter(n, ms) {
    const cur = loadBest(n);
    if (cur === null || ms < cur) {
      try {
        localStorage.setItem(bestKey(n), ms);
      } catch (e) {
        bestMemory[bestKey(n)] = ms;
      }
    }
  }

  // Соответствие физической цифровой клавиши (e.code, не зависит от раскладки)
  // размеру таблицы: Shift+2..Shift+9 -> 2..9, Shift+0 -> 10.
  const SHIFT_DIGIT_TO_SIZE = {
    Digit2: 2, Digit3: 3, Digit4: 4, Digit5: 5, Digit6: 6,
    Digit7: 7, Digit8: 8, Digit9: 9, Digit0: 10
  };

  // Сброс рекорда ОДНОЙ таблицы (размера n) ТОЛЬКО текущего уровня —
  // Shift+2..Shift+9, Shift+0 (см. обработчик keydown ниже).
  function resetLevelSizeRecord(n) {
    if (!confirm(`Сбросить рекорд таблицы ${n}x${n} уровня "${currentLevel.name}"?`)) return;
    try { localStorage.removeItem(bestKey(n)); } catch (e) {}
    delete bestMemory[bestKey(n)];
    if (recordsOn) refreshTileRecords();
  }

  function showMenu() {
    inGame = false;
    gameScreen.style.display = 'none';
    menuScreen.style.display = 'flex';
    updateEyeVisibility();
    alignCountdownToLevelGrid();
    clearMemorizeTimeout();  // уходим с уровня — не даём фазе запоминания сработать в пустоту
    memorizePhase = false;
    stopMemoryLevelCountdown();
    updateMemoryTimerVisibility();
  }

  // ---------- глаз: размер и прозрачность (сохраняются, если меняли) ----------
  const EYE_DEFAULT_SIZE = 120;
  const EYE_DEFAULT_OPACITY = 1;
  let eyeSize = loadNum('schulte-eye-size', EYE_DEFAULT_SIZE);
  let eyeOpacity = loadNum('schulte-eye-opacity', EYE_DEFAULT_OPACITY);

  function loadNum(key, def) {
    try {
      const v = localStorage.getItem(key);
      return v ? parseFloat(v) : def;
    } catch (e) {
      return def;
    }
  }

  function saveNum(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }

  function applyEyeStyle() {
    document.documentElement.style.setProperty('--eye-size', eyeSize + 'px');
    document.documentElement.style.setProperty('--eye-opacity', eyeOpacity);
  }
  applyEyeStyle();

  // Глаз доступен только во время прохождения таблицы (inGame), пропадает
  // на экране с итоговым таймером и снова появляется при старте/рестарте,
  // если был включён. В меню/выборе уровня глаза быть не должно.
  // Само состояние "включён/выключен" сохраняется в localStorage
  // (ключ schulte-eye-on), поэтому после перезагрузки страницы, если
  // глаз был включён, он останется включённым.
  function loadEyeOn() {
    try { return localStorage.getItem('schulte-eye-on') === 'true'; } catch (e) { return false; }
  }
  function saveEyeOn(val) {
    try { localStorage.setItem('schulte-eye-on', val ? 'true' : 'false'); } catch (e) {}
  }
  let eyeOn = loadEyeOn();

  function updateEyeVisibility() {
    if (inGame && eyeOn && !finished) {
      eyeOverlay.classList.add('show');
    } else {
      eyeOverlay.classList.remove('show');
    }
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startGame(n) {
    currentSize = n;
    inGame = true;
    scale = loadScale(n);
    menuScreen.style.display = 'none';
    gameScreen.style.display = 'block';
    // baseSize считается ОДИН РАЗ здесь, при входе в таблицу — а не в buildGrid(),
    // чтобы он не "плавал" между разными окнами window.innerWidth/innerHeight
    // на каждом рестарте (пробел / колесо мыши вниз = следующая таблица).
    // Иначе, если размеры окна браузера чуть меняются между двумя вызовами
    // buildGrid() (например, из-за анимации перехода в полноэкранный режим
    // F11, которая доигрывает уже после того, как таблица открылась), сетка
    // визуально "прыгала" в размере сама по себе, без участия пользователя.
    baseSize = applyLayout(n);
    if (currentLevel.memoryLevel) {
      startMemoryRound(n, true);
    } else {
      buildGrid(n);
    }
    updateMemoryTimerVisibility();
  }

  function applyLayout(n) {
    let padPct = 0;
    if (topPad15.has(n)) padPct = 0.15;
    else if (topPad10.has(n)) padPct = 0.10;

    const padPx = window.innerHeight * padPct;
    const availH = window.innerHeight - padPx * 2;
    const availW = window.innerWidth * 0.96;
    const size = Math.max(0, Math.min(availH, availW));

    return size;
  }

  function resizeGrid() {
    const size = baseSize * scale;
    gridWrap.style.width = size + 'px';
    gridWrap.style.height = size + 'px';

    const cellW = (size - COL_GAP * (currentSize - 1)) / currentSize;
    const cellH = (size - ROW_GAP * (currentSize - 1)) / currentSize;
    currentFontSize = Math.min(cellW, cellH) * 0.5;
    grid.querySelectorAll('.cell').forEach(c => {
      c.style.fontSize = currentFontSize + 'px';
    });
  }

  function buildGrid(n) {
    finished = false;
    currentTarget = 1;
    mistakes = 0;
    const hasGap = oddWithGap.has(n);
    total = hasGap ? (n * n - 1) : (n * n);
    finishOverlay.classList.remove('show');
    gridWrap.style.display = '';

    // baseSize здесь больше НЕ пересчитывается (см. startGame()) — он должен
    // оставаться стабильным на протяжении всей "сессии" в этом размере/уровне,
    // независимо от того, сколько раз перегенерируется таблица (пробел,
    // колесо мыши вниз). Меняется он только явно через startGame() — то есть
    // заново при входе в размер/уровень — либо через ручной масштаб (+/-).

    const order = shuffle(Array.from({length: total}, (_, i) => i + 1));

    grid.innerHTML = '';
    grid.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${n}, 1fr)`;
    grid.style.columnGap = COL_GAP + 'px';
    grid.style.rowGap = ROW_GAP + 'px';

    const centerIndex = hasGap ? Math.floor((n * n) / 2) : -1;

    let numIdx = 0;
    for (let i = 0; i < n * n; i++) {
      const cell = document.createElement('button');
      cell.style.zIndex = String(i); // нижние ряды (больше i) поверх теней верхних

      if (i === centerIndex) {
        cell.className = 'cell static-empty';
      } else {
        const ord = order[numIdx++];
        cell.className = 'cell';
        const label = currentLevel.label(ord, total);
        cell.textContent = label;
        cell.dataset.ord = ord;
        cell.dataset.label = label; // <-- нужно уровням с revealDigit (13-16), чтобы знать, что вернуть на клетку
        // На уровнях с clickAnywhere (9 и 10) клик по конкретной клетке не нужен —
        // засчитывает клик где угодно на экране, см. глобальный обработчик ниже.
        if (!currentLevel.clickAnywhere) {
          cell.addEventListener('click', () => handleCellClick(cell, ord));
        }
      }
      grid.appendChild(cell);
    }

    resizeGrid();
    // На уровнях с запоминанием (13-16) таймер рекорда стартует НЕ здесь, а
    // позже — когда цифры прячутся после фазы запоминания (см. beginMemorySearchPhase()
    // в разделе "ТАЙМЕР ДЛЯ ЗАПОМИНАНИЯ" ниже).
    if (!currentLevel.memoryLevel) {
      startTime = performance.now();
    }
    updateEyeVisibility();
  }

  // ---------- УРОВНИ 9/10/11/12: клик в ЛЮБОЕ место ИГРОВОГО ЭКРАНА засчитывается
  // за клик по клетке с текущим искомым числом (см. флаг clickAnywhere у уровня).
  // Важно: проверяем, что клик пришёлся именно на #game-screen, а не на плитку
  // размера/уровня в меню — иначе тот же клик, которым запускается уровень,
  // сразу же засчитывал бы и первую цифру. ----------
  document.addEventListener('click', (e) => {
    if (!inGame || finished || !currentLevel.clickAnywhere) return;
    if (!gameScreen.contains(e.target)) return;
    const targetCell = grid.querySelector(`.cell[data-ord="${currentTarget}"]`);
    if (targetCell) handleCellClick(targetCell, currentTarget);
  });

  // Настройки мигания клеток для уровней с colorFeedback (сейчас — 3 и 4).
  // Цвет и прозрачность — CSS-переменные в :root (--flash-correct-color/opacity,
  // --flash-wrong-color/opacity). Длительность — тут, в миллисекундах.
  const FLASH_CORRECT_DURATION_MS = 100;
  const FLASH_WRONG_DURATION_MS = 100;

  // Общая функция мигания клетки цветом на заданную длительность (мс).
  function flashCell(cell, cls, durationMs) {
    cell.classList.remove(cls);
    void cell.offsetWidth;
    cell.classList.add(cls);
    setTimeout(() => cell.classList.remove(cls), durationMs);
  }

  // Алфавит для уровней с revealLetter (7 и 8) — заглавные русские буквы.
  const ALPHABET_RU = 'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
  function randomRussianLetter() {
    return ALPHABET_RU[Math.floor(Math.random() * ALPHABET_RU.length)];
  }
  // Столько случайных букв, сколько цифр было в числе (1 цифра — 1 буква, 2 цифры — 2 буквы).
  function randomRussianLetters(count) {
    let s = '';
    for (let i = 0; i < count; i++) s += randomRussianLetter();
    return s;
  }

  function handleCellClick(cell, ord) {
    // Уровни 13-16: пока идёт фаза запоминания (цифры видны, но клик не
    // должен ничего делать — ни прятать цифры, ни считать ошибку, ни
    // запускать таймер рекорда) — просто игнорируем клик целиком.
    if (memorizePhase) return;

    if (finished || cell.classList.contains('static-empty')) return;

    if (cell.dataset.cleared === '1') {
      // Уже отвечена правильно. На обычных уровнях клетка после верного
      // ответа некликабельна (см. ниже), поэтому сюда попадаем только
      // на уровнях с colorFeedback — там повторный клик мигает красным.
      if (currentLevel.colorFeedback) flashCell(cell, 'flash-wrong', FLASH_WRONG_DURATION_MS);
      return;
    }

    if (ord !== currentTarget) {
      mistakes++;
      if (currentLevel.colorFeedback) {
        flashCell(cell, 'flash-wrong', FLASH_WRONG_DURATION_MS);
      } else {
        cell.classList.remove('shake');
        void cell.offsetWidth;
        cell.classList.add('shake');
      }
      return;
    }

    cell.dataset.cleared = '1';

    if (currentLevel.revealDigit) {
      // Уровни 13-16: цифра была спрятана после фазы запоминания —
      // при верном клике возвращаем её исходное значение (dataset.label)
      // и она остаётся видимой до конца уровня.
      cell.textContent = cell.dataset.label;
      if (currentLevel.colorFeedback) {
        // Уровни 15/16 — вдобавок зелёная вспышка, как на уровне 3;
        // клетка остаётся кликабельной (повторный клик мигнёт красным).
        flashCell(cell, 'flash-correct', FLASH_CORRECT_DURATION_MS);
      } else {
        // Уровни 13/14 — без вспышки, клетка становится некликабельной.
        cell.style.pointerEvents = 'none';
      }
    } else if (currentLevel.colorFeedback) {
      // Число не исчезает, клетка остаётся кликабельной специально
      // для того, чтобы повторный клик по ней мигал красным (см. выше).
      flashCell(cell, 'flash-correct', FLASH_CORRECT_DURATION_MS);
    } else if (currentLevel.revealLetter) {
      // Число заменяется случайными заглавными русскими буквами (столько же
      // букв, сколько было цифр) и остаётся видимым.
      cell.textContent = randomRussianLetters(cell.textContent.length);
      cell.style.pointerEvents = 'none';
    } else {
      cell.textContent = '';
      cell.style.pointerEvents = 'none';
    }

    currentTarget++;

    if (currentTarget > total) {
      finishGame();
    }
  }

  function formatTime(ms) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const sec = totalSec % 60;
    const min = Math.floor(totalSec / 60);
    const pad = v => String(v).padStart(2, '0');
    return `${pad(min)}:${pad(sec)}:${pad(cs)}`;
  }

  function finishGame() {
    const elapsed = performance.now() - startTime;
    saveBestIfBetter(currentSize, elapsed); // рекорд считается всегда, даже при instantRestart

    if (currentLevel.memoryInstantRestart) {
      // Уровни 14/16: без плашки с итогом — таблица перестраивается заново
      // (новое расположение) и фаза запоминания запускается с нуля.
      startMemoryRound(currentSize, true);
      return;
    }

    if (currentLevel.instantRestart) {
      // Без плашки с результатом — сразу новая таблица того же размера.
      buildGrid(currentSize);
      return;
    }

    finished = true;
    finishTime.textContent = formatTime(elapsed);
    if (currentLevel.hideErrorsLabel) {
      finishErrors.style.display = 'none';
    } else {
      finishErrors.style.display = '';
      finishErrors.textContent = 'ОШИБОК: ' + mistakes;
    }
    gridWrap.style.display = 'none';
    finishOverlay.classList.add('show');
    updateEyeVisibility();
  }

  // ---------- РЕКОРДЫ: строка под каждой плиткой, видна пока зажата R/К ----------
  let recordsOn = false;

  function refreshTileRecords() {
    sizes.forEach(n => {
      const ms = loadBest(n);
      tileRecordEls[n].textContent = ms !== null ? formatTime(ms) : '00:00:00';
    });
  }

  function updateRecordsVisibility() {
    if (recordsOn) refreshTileRecords();
    sizes.forEach(n => {
      tileRecordEls[n].classList.toggle('show', recordsOn);
    });
  }

  // ---------- ОКНО ИНФОРМАЦИИ: во весь экран, пока зажата B/И ----------
  let infoOn = false;

  function updateInfoVisibility() {
    infoOverlay.classList.toggle('show', infoOn);
  }

  // ---------- ТАЙМЕР ОБРАТНОГО ОТСЧЁТА (клавиша N, физически она же Т в русской раскладке) ----------
  // Нажал N/Т — появляется окно ввода. Пока таймер тикает — на экране ничего не видно
  // (никакой бегущей плашки с временем). Когда время вышло — на 5 секунд появляется
  // плашка "ВРЕМЯ ВЫШЛО" в том же месте, потом сама пропадает.
  // Формат ввода:
  //   "5"            -> 5 минут 0 секунд
  //   "5.20"/"5,20"  -> 5 минут 20 секунд
  //   "5.2"          -> 5 минут 2 секунды (не 5 минут 12 секунд — после точки/запятой
  //                     число читается как есть, а не как десятичная дробь)
  //   "3.61"         -> секунд (61) больше 60, поэтому они не считаются -> просто 3 минуты
  //   ".15" / ",133" -> точка/запятая БЕЗ числа перед ней — всё, что после неё, это
  //                     СЕКУНДЫ целиком (без разбивки на минуты): 15 секунд / 133 секунды
  // Enter — окно ввода закрывается, таймер стартует/перезапускается от введённого значения.
  // Повторное нажатие N/Т снова открывает окно ввода (можно ввести новое время — тогда
  // текущий отсчёт заменяется новым; можно нажать Enter на пустом поле — тогда текущий
  // отсчёт не трогается, окно просто закрывается).
  const countdownInputOverlay = document.getElementById('countdown-input-overlay');
  const countdownInputEl = document.getElementById('countdown-input');
  const countdownDisplay = document.getElementById('countdown-display');

  let countdownTimeoutId = null;      // основной таймер на всю длительность отсчёта
  let countdownExpiredHideId = null;  // скрыть плашку "ВРЕМЯ ВЫШЛО" через 5 секунд

  function parseCountdownInput(raw) {
    const s = raw.trim().replace(',', '.');
    if (!s) return null;

    if (s.startsWith('.')) {
      // Точка/запятая без числа перед ней — всё, что после, это секунды целиком.
      const totalSeconds = parseInt(s.slice(1), 10);
      if (isNaN(totalSeconds) || totalSeconds < 0) return null;
      return totalSeconds * 1000;
    }

    const parts = s.split('.');
    const minutes = parseInt(parts[0], 10);
    if (isNaN(minutes) || minutes < 0) return null;
    let seconds = 0;
    if (parts.length > 1 && parts[1] !== '') {
      const secVal = parseInt(parts[1], 10);
      if (!isNaN(secVal) && secVal >= 0 && secVal <= 60) seconds = secVal;
    }
    return minutes * 60000 + seconds * 1000;
  }

  function clearCountdownTimers() {
    if (countdownTimeoutId) { clearTimeout(countdownTimeoutId); countdownTimeoutId = null; }
    if (countdownExpiredHideId) { clearTimeout(countdownExpiredHideId); countdownExpiredHideId = null; }
  }

  function startCountdown(ms) {
    clearCountdownTimers();
    countdownDisplay.classList.remove('show', 'expired'); // пока тикает — плашка не видна
    countdownTimeoutId = setTimeout(() => {
      countdownTimeoutId = null;
      countdownDisplay.textContent = 'ВРЕМЯ ВЫШЛО';
      countdownDisplay.classList.add('show', 'expired');
      countdownExpiredHideId = setTimeout(() => {
        countdownDisplay.classList.remove('show', 'expired');
        countdownExpiredHideId = null;
      }, 5000); // <-- сколько секунд висит плашка "ВРЕМЯ ВЫШЛО"
    }, ms);
  }

  function openCountdownInput() {
    countdownInputEl.value = '';
    countdownInputOverlay.classList.add('show');
    countdownInputEl.focus();
  }

  countdownInputEl.addEventListener('keydown', (e) => {
    // Не даём нажатиям внутри поля ввода долетать до общих хоткеев приложения (R/К, U/Г и т.д.).
    e.stopPropagation();
    if (e.key === 'Enter') {
      e.preventDefault();
      const ms = parseCountdownInput(countdownInputEl.value);
      if (ms !== null) startCountdown(ms);
      countdownInputOverlay.classList.remove('show');
    }
  });

  // Раньше эта функция сама выравнивала плашку по правому краю кнопок "∞".
  // Теперь положение плашки задаётся вручную через CSS-переменные
  // --countdown-offset-x / --countdown-offset-y (см. :root), поэтому
  // авто-выравнивание отключено (функция ничего не делает, но оставлена
  // как есть на случай, если понадобится в будущем — вызовы её не трогал).
  function alignCountdownToLevelGrid() {
    // намеренно пусто — позиция теперь ручная, см. --countdown-offset-x/y
  }

  window.addEventListener('resize', () => {
    if (menuScreen.style.display !== 'none') alignCountdownToLevelGrid();
  });

  // ---------- ТАЙМЕР ДЛЯ ЗАПОМИНАНИЯ (уровни 13-16) ----------
  // Плашка справа снизу (симметрично таймеру обратного отсчёта, который
  // слева снизу) — но это НЕ обратный отсчёт на экране, а настройка:
  // 1-я строка "время на запоминание", 2-я строка — сохранённое значение
  // в формате мм:сс (по умолчанию 00:10). Клик по плашке — редактирование:
  // вводишь целое число СЕКУНД (дробные не допускаются), Enter — сохраняет
  // в localStorage (ключ schulte-memory-seconds) и подставляется
  // автоматически при следующем входе. Это значение и используется как
  // длительность фазы "все цифры видны" на уровнях 13-16 (см. startMemoryRound).
  //
  // ГДЕ НАСТРОИТЬ РАСПОЛОЖЕНИЕ И ЦВЕТА ЭТОЙ ПЛАШКИ:
  //   :root: --memory-timer-offset-x / --memory-timer-offset-y — положение
  //   (сдвиг от ЦЕНТРА экрана, в px), --memory-timer-width/height — размер плашки,
  //   --memory-timer-label-font-size / --memory-timer-value-font-size —
  //   размеры шрифта двух строк, --memory-timer-bg-color / --memory-timer-
  //   text-color — цвета (по умолчанию совпадают с обычными плитками
  //   --tile / --tile-text, но заданы ОТДЕЛЬНЫМИ переменными, чтобы можно
  //   было перекрасить именно эту плашку, не трогая остальные).
  //
  // #memory-timer-widget (справа) — ТОЛЬКО плашка-настройка в меню размеров
  //   уровней 13-16. Показывается ВСЕГДА в меню и НИКОГДА во время игры —
  //   на самом уровне вместо неё показывается отдельная плашка обратного
  //   отсчёта #memory-level-timer-widget (слева), см. ниже.
  const DEFAULT_MEMORY_SECONDS = 10;
  const MEMORY_LEVEL_IDS = new Set(['level13', 'level14', 'level15', 'level16']);

  const memoryTimerWidget = document.getElementById('memory-timer-widget');
  const memoryTimerValueEl = document.getElementById('memory-timer-value');
  const memoryTimerInputEl = document.getElementById('memory-timer-input');

  function getMemorySeconds() {
    try {
      const v = localStorage.getItem('schulte-memory-seconds');
      const n = v !== null ? parseInt(v, 10) : NaN;
      return (!isNaN(n) && n > 0) ? n : DEFAULT_MEMORY_SECONDS;
    } catch (e) {
      return DEFAULT_MEMORY_SECONDS;
    }
  }

  function saveMemorySeconds(n) {
    try { localStorage.setItem('schulte-memory-seconds', String(n)); } catch (e) {}
  }

  function formatMinSec(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function refreshMemoryTimerDisplay() {
    memoryTimerValueEl.textContent = formatMinSec(getMemorySeconds());
  }
  refreshMemoryTimerDisplay();

  function openMemoryTimerInput() {
    memoryTimerInputEl.value = '';
    memoryTimerValueEl.style.display = 'none';
    memoryTimerInputEl.style.display = 'block';
    memoryTimerInputEl.focus();
  }

  function closeMemoryTimerInput() {
    memoryTimerInputEl.style.display = 'none';
    memoryTimerValueEl.style.display = '';
  }

  memoryTimerWidget.addEventListener('click', (e) => {
    // Клик внутри самого поля ввода не должен заново его открывать/сбрасывать.
    if (e.target === memoryTimerInputEl) return;
    openMemoryTimerInput();
  });

  memoryTimerInputEl.addEventListener('keydown', (e) => {
    // Не даём нажатиям внутри поля ввода долетать до общих хоткеев приложения.
    e.stopPropagation();
    if (e.key === 'Enter') {
      e.preventDefault();
      const raw = memoryTimerInputEl.value.trim();
      // Только целые числа секунд (без точки/запятой) — дробные значения не допускаются.
      if (/^\d+$/.test(raw)) {
        const secs = parseInt(raw, 10);
        if (secs > 0) {
          saveMemorySeconds(secs);
          refreshMemoryTimerDisplay();
        }
      }
      closeMemoryTimerInput();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closeMemoryTimerInput();
    }
  });

  memoryTimerInputEl.addEventListener('blur', closeMemoryTimerInput);

  // Показывать плашку-настройку (#memory-timer-widget, справа): ТОЛЬКО если
  // сейчас выбран один из уровней 13-16 И мы в меню размеров (не в игре).
  // Во время самой игры эта плашка НИКОГДА не показывается — вместо неё
  // работает отдельная плашка обратного отсчёта слева (см. ниже).
  function updateMemoryTimerVisibility() {
    const isMemoryLevel = MEMORY_LEVEL_IDS.has(currentLevelId);
    const show = isMemoryLevel && !inGame;
    memoryTimerWidget.classList.toggle('show', show);
  }
  updateMemoryTimerVisibility();

  // ---------- плашка ОБРАТНОГО ОТСЧЁТА на самом уровне (13-16) ----------
  // #memory-level-timer-widget (слева) — настоящий тикающий обратный отсчёт:
  // стартует от значения getMemorySeconds() в момент начала фазы запоминания
  // (вход на уровень / рестарт) и идёт до 00:00, после чего фаза запоминания
  // и так заканчивается сама (см. startMemoryRound/beginMemorySearchPhase).
  // Видна только пока memorizePhase === true; исчезает, когда начинается
  // поиск, и не показывается вообще, если SHOW_MEMORY_LEVEL_TIMER === false.
  const SHOW_MEMORY_LEVEL_TIMER = true; // <-- true/false: показывать ли обратный отсчёт на самом уровне
  const memoryLevelTimerWidget = document.getElementById('memory-level-timer-widget');
  const memoryLevelTimerValueEl = document.getElementById('memory-level-timer-value');
  let memoryLevelTimerIntervalId = null;

  function stopMemoryLevelCountdown() {
    if (memoryLevelTimerIntervalId) {
      clearInterval(memoryLevelTimerIntervalId);
      memoryLevelTimerIntervalId = null;
    }
    memoryLevelTimerWidget.classList.remove('show');
  }

  function startMemoryLevelCountdown(totalSeconds) {
    stopMemoryLevelCountdown();
    if (!SHOW_MEMORY_LEVEL_TIMER) return;
    const endAt = performance.now() + totalSeconds * 1000;
    const render = () => {
      const remainingMs = Math.max(0, endAt - performance.now());
      memoryLevelTimerValueEl.textContent = formatMinSec(Math.ceil(remainingMs / 1000));
    };
    render();
    memoryLevelTimerWidget.classList.add('show');
    memoryLevelTimerIntervalId = setInterval(() => {
      render();
      if (performance.now() >= endAt) stopMemoryLevelCountdown();
    }, 100);
  }

  // ---------- уровни 13-16: фаза запоминания ----------
  // memorizePhase === true, пока все цифры видны и клики по клеткам ничего
  // не делают (см. проверку в начале handleCellClick). Таймер рекорда
  // (startTime) стартует только в beginMemorySearchPhase(), когда цифры
  // прячутся и начинается настоящий поиск.
  let memorizePhase = false;
  let memorizeTimeoutId = null;

  function clearMemorizeTimeout() {
    if (memorizeTimeoutId) { clearTimeout(memorizeTimeoutId); memorizeTimeoutId = null; }
  }

  // freshGrid === true — построить новую (перемешанную) таблицу перед
  // фазой запоминания. Используется и при первом входе на уровень, и при
  // любом рестарте (Space / колесо мыши вниз / завершение с memoryInstantRestart) —
  // цикл "показать все цифры -> подождать -> спрятать -> искать" всегда
  // проигрывается заново целиком.
  function startMemoryRound(n, freshGrid) {
    clearMemorizeTimeout();
    if (freshGrid) {
      buildGrid(n); // покажет все цифры на местах (см. buildGrid) и НЕ запустит startTime (memoryLevel)
    }
    memorizePhase = true;
    updateEyeVisibility();
    updateMemoryTimerVisibility();
    const secs = getMemorySeconds();
    startMemoryLevelCountdown(secs);
    memorizeTimeoutId = setTimeout(() => {
      memorizeTimeoutId = null;
      beginMemorySearchPhase();
    }, secs * 1000);
  }

  // Прячет цифры (кроме уже отвеченных — на случай будущих модификаций) и
  // запускает таймер рекорда — с этого момента начинается обычный поиск.
  function beginMemorySearchPhase() {
    memorizePhase = false;
    stopMemoryLevelCountdown();
    grid.querySelectorAll('.cell[data-ord]').forEach(c => {
      if (c.dataset.cleared !== '1') c.textContent = '';
    });
    startTime = performance.now();
  }

  // ---------- клавиатура ----------
  document.addEventListener('keydown', (e) => {
    // Shift+2..Shift+9, Shift+0 — сброс рекорда ОДНОЙ таблицы (2х2..9х9, 10х10)
    // ТОЛЬКО текущего уровня (с подтверждением). Ctrl не нужен и не проверяется.
    if (e.shiftKey && SHIFT_DIGIT_TO_SIZE[e.code] !== undefined) {
      e.preventDefault();
      resetLevelSizeRecord(SHIFT_DIGIT_TO_SIZE[e.code]);
      return;
    }

    if (e.code === 'KeyR') { // R (англ.) / К (рус.) — показать рекорды под плитками, пока зажата
      e.preventDefault();
      if (!recordsOn) {
        recordsOn = true;
        updateRecordsVisibility();
      }
    }

    if (e.code === 'KeyB') { // B (англ.) / И (рус.) — окно информации на весь экран, пока зажата
      e.preventDefault();
      if (!infoOn) {
        infoOn = true;
        updateInfoVisibility();
      }
    }

    if (e.code === 'KeyN') { // N (англ.) / Т (рус.) — окно ввода таймера обратного отсчёта
      e.preventDefault();
      openCountdownInput();
    }

    if (inGame) {
      if (e.code === 'KeyU') { // U (англ.) / Г (рус.) — вкл/выкл глаз (только во время игры)
        e.preventDefault();
        eyeOn = !eyeOn;
        saveEyeOn(eyeOn);
        updateEyeVisibility();
      }
      if (e.code === 'KeyK') { // K (англ.) / Л (рус.) — уменьшить прозрачность глаза (мин 10%)
        e.preventDefault();
        eyeOpacity = Math.max(0.1, +(eyeOpacity - 0.1).toFixed(2));
        saveNum('schulte-eye-opacity', eyeOpacity);
        applyEyeStyle();
      }
      if (e.code === 'KeyL') { // L (англ.) / Д (рус.) — увеличить прозрачность глаза (макс 100%)
        e.preventDefault();
        eyeOpacity = Math.min(1, +(eyeOpacity + 0.1).toFixed(2));
        saveNum('schulte-eye-opacity', eyeOpacity);
        applyEyeStyle();
      }
      if (e.code === 'KeyP') { // P (англ.) / З (рус.) — увеличить размер глаза
        e.preventDefault();
        eyeSize += 10;
        saveNum('schulte-eye-size', eyeSize);
        applyEyeStyle();
      }
      if (e.code === 'KeyO') { // O (англ.) / Щ (рус.) — уменьшить размер глаза
        e.preventDefault();
        eyeSize = Math.max(20, eyeSize - 10);
        saveNum('schulte-eye-size', eyeSize);
        applyEyeStyle();
      }
    }

    if (!inGame) return;

    if (e.code === 'Space') {
      e.preventDefault();
      if (currentLevel.memoryLevel) {
        startMemoryRound(currentSize, true);
      } else {
        buildGrid(currentSize);
      }
      return;
    }
    if (e.code === 'Escape') {
      e.preventDefault();
      showMenu();
      return;
    }
    if (e.key === '+' || e.key === '=' || e.code === 'NumpadAdd') {
      e.preventDefault();
      scale = +(scale + 0.1).toFixed(2);
      saveScale(currentSize, scale);
      resizeGrid();
      return;
    }
    if (e.key === '-' || e.code === 'NumpadSubtract') {
      e.preventDefault();
      scale = Math.max(0.2, +(scale - 0.1).toFixed(2));
      saveScale(currentSize, scale);
      resizeGrid();
      return;
    }
  });

  document.addEventListener('keyup', (e) => {
    if (e.code === 'KeyR') { // отпустили R/К — прячем рекорды под плитками
      recordsOn = false;
      updateRecordsVisibility();
    }
    if (e.code === 'KeyB') { // отпустили B/И — прячем окно информации
      infoOn = false;
      updateInfoVisibility();
    }
  });

  // ---------- средняя кнопка мыши: подсказка нужной цифры ----------
  document.addEventListener('mousedown', (e) => {
    if (e.button === 1) {
      e.preventDefault();
      if (inGame && !finished) {
        peekOverlay.textContent = currentLevel.label(currentTarget, total);
        peekOverlay.style.fontSize = currentFontSize + 'px';
        peekOverlay.classList.add('show');
      }
    }
  });

  document.addEventListener('mouseup', (e) => {
    if (e.button === 1) {
      peekOverlay.classList.remove('show');
    }
  });

  document.addEventListener('auxclick', (e) => {
    if (e.button === 1) e.preventDefault();
  });

  // ---------- колесо мыши: навигация ----------
  document.addEventListener('wheel', (e) => {
    if (inGame) {
      if (e.deltaY > 0) {
        if (currentLevel.memoryLevel) {
          startMemoryRound(currentSize, true);
        } else {
          buildGrid(currentSize);
        }
      } else if (e.deltaY < 0) {
        showMenu();
      }
    }
  }, { passive: true });

  // ---------- мобильная версия: определение устройства + свайпы ----------
  // isMobileDevice — true ТОЛЬКО на реальном телефоне/планшете (по строке
  // navigator.userAgent или по "грубому" указателю pointer:coarse — это и
  // отличает палец от мыши). Обычное сужение окна браузера на компьютере
  // сюда не попадает, поэтому свайпы и уменьшенные плитки уровней на
  // компьютере не появляются никогда, независимо от размера окна.
  function isMobileDevice() {
    const uaMobile = /Android|iPhone|iPad|iPod|IEMobile|BlackBerry|Opera Mini|Mobile/i.test(navigator.userAgent);
    const coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    return uaMobile || coarsePointer;
  }

  if (isMobileDevice()) {
    document.body.classList.add('is-mobile');
  }

  // Свайп вниз во время игры — обновить таблицу (то же самое, что Space/
  // прокрутка колеса вниз на компьютере). Свайп вверх — выйти в меню (то же,
  // что Esc/прокрутка колеса вверх). Работает только когда есть класс
  // is-mobile И только пока идёт игра (inGame) — на экранах меню свайпы
  // ничего не делают, чтобы не мешать обычному скроллу/тапам по плиткам.
  const SWIPE_MIN_DISTANCE = 60; // px — минимальная длина свайпа по вертикали
  const SWIPE_MAX_OFF_AXIS = 60; // px — максимальное отклонение по горизонтали,
                                  // чтобы не путать свайп с диагональным жестом
  let touchStartX = 0;
  let touchStartY = 0;

  document.addEventListener('touchstart', (e) => {
    if (!document.body.classList.contains('is-mobile') || !inGame) return;
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (!document.body.classList.contains('is-mobile') || !inGame) return;
    const touch = e.changedTouches[0];
    if (!touch) return;
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    if (Math.abs(dx) > SWIPE_MAX_OFF_AXIS) return; // слишком наискось — не свайп
    if (dy > SWIPE_MIN_DISTANCE) {
      buildGrid(currentSize); // свайп вниз — обновить (рестарт) таблицу
    } else if (dy < -SWIPE_MIN_DISTANCE) {
      showMenu(); // свайп вверх — выйти в меню
    }
  }, { passive: true });

  showMenu();
</script>

</body>
</html>
